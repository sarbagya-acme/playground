name: Deploy

on:
  push:
    branches:
      - workflow
  workflow_dispatch:
    inputs:
      version_type:
        description: Version Bum Type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --silent
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Configure Git
        run: |
          git config --global user.name "Release Bot"
          git config --global user.email "bot@acmesoftware.com"

      - name: Version bump
        run: npm version ${{ github.event.inputs.version_type || 'patch' }}

      - name: Build
        run: |
          npm run build
          npm run deploy
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Push changes back to branch
        if: success()
        run: git push origin HEAD
