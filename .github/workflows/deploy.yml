name: Deploy

on:
  push:
    branches:
      - workflow
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --silent
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: 🔧 Configure Git identity
        run: |
          git config --global user.name "Release Bot"
          git config --global user.email "bot@acmesoftware.com"

      - name: 🔢 Bump version
        run: npm version ${{ github.event.inputs.version_type || 'patch' }} --no-git-tag-version
        working-directory: electron-app

      - name: 🚀 Build and deploy application
        run: |
          npm run build
          npm run deploy
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GH_TOKEN: ${{ secrets.PAT }}

      - name: 📝 Commit and push version changes
        if: success()
        run: |
          git add electron-app/package.json
          NEW_VERSION=$(node -p "require('./electron-app/package.json').version")
          git commit -m "Bump version to v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin HEAD --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
